[project]
name = "my-server"
version = "0.1.0"
description = "FastAPI Server"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai",
    "plyer",
    "python-dotenv",
    "youtube-transcript-api",
    "psutil",
    "google-genai>=1.47.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "ruff>=0.14.6",
]
