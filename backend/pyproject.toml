[project]
name = "my-server"
version = "0.1.0"
description = "FastAPI Server"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai",
    "python-dotenv",
    "youtube-transcript-api",
    "psutil",
    "google-genai>=1.47.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "pyrefly>=0.57.1",
    "pyinstaller>=6.0.0",
]
